@let t = i18n.t().hero;
<section class="hero" id="inicio">
  <div class="container">
    <div class="row align-items-center g-5">
      <div class="col-lg-7 order-2 order-lg-1">
        <span class="badge rounded-pill text-body-secondary bg-body border fw-medium px-3 py-2 mb-3 availability">
          <span class="status-dot me-2"></span>{{ t.availability }}
        </span>
        <h1 class="display-4 fw-bolder mb-2">Abel Marcial<br>Almada Meza</h1>
        <p class="fs-5 fw-bold text-primary mb-3">{{ t.role }}</p>
        <p class="lead text-body-secondary mb-4">{{ t.lead }}</p>

        <div class="d-flex flex-wrap gap-2 mb-4">
          <a class="btn btn-primary btn-lg px-4" [href]="cvUrl()" download="Abel-Almada-Meza-CV.pdf">
            <i class="bi bi-file-earmark-arrow-down me-2"></i>{{ t.downloadCv }}
          </a>
          <a class="btn btn-outline-secondary btn-lg px-4" href="#contacto">
            <i class="bi bi-send me-2"></i>{{ t.contactMe }}
          </a>
        </div>

        <div class="d-flex gap-2">
          <a class="btn btn-icon" [href]="profile.linkedin" target="_blank" rel="noopener" aria-label="LinkedIn">
            <i class="bi bi-linkedin"></i>
          </a>
          <a class="btn btn-icon" [href]="profile.github" target="_blank" rel="noopener" aria-label="GitHub">
            <i class="bi bi-github"></i>
          </a>
          <a class="btn btn-icon" [href]="'mailto:' + profile.email" aria-label="Email">
            <i class="bi bi-envelope-fill"></i>
          </a>
        </div>
      </div>

      <div class="col-lg-5 order-1 order-lg-2 text-center">
        <img class="hero-photo rounded-circle shadow mb-4" [src]="profile.photo" [alt]="t.photoAlt" width="220" height="220">
        <div class="d-flex flex-wrap justify-content-center gap-2">
          @for (b of t.badges; track b.label) {
            <span class="badge rounded-pill bg-body text-body border fw-semibold px-3 py-2">
              <i class="bi {{ b.icon }} text-primary me-1"></i>{{ b.label }}
            </span>
          }
        </div>
      </div>
    </div>
  </div>
</section>
